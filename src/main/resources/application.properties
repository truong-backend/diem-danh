# ─── RabbitMQ ─────────────────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASS:guest}
spring.rabbitmq.virtual-host=/

# App RabbitMQ exchanges / queues
app.rabbitmq.exchange.notification=notification.exchange
app.rabbitmq.exchange.attendance=attendance.exchange
app.rabbitmq.queue.notification=notification.queue
app.rabbitmq.queue.attendance=attendance.queue
app.rabbitmq.routing.notification=notification.routing.key
app.rabbitmq.routing.attendance=attendance.routing.key

# Redis cache TTL (seconds)
app.redis.ttl.qr-token=300
app.redis.ttl.session=600
app.redis.ttl.jwt-blacklist=86400
