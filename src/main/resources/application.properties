# ===================== NEO4J =====================
spring.neo4j.uri=${NEO4J_URI}
spring.neo4j.authentication.username=${NEO4J_USERNAME}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.data.neo4j.database=${NEO4J_DATABASE}

# ===================== MINIO (app.minio.* used by MinioService) =====================
app.minio.url=${MINIO_URL}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket=${MINIO_BUCKET}
app.minio.public-url=${MINIO_PUBLIC_URL}

# ===================== MINIO (minio.* used by MinioConfig & MinioServiceImpl) =====================
minio.endpoint=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}

# ===================== REDIS =====================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}

app.redis.ttl.jwt-blacklist=86400
app.redis.ttl.qr-token=300
app.redis.ttl.session=600

# ===================== RABBITMQ =====================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}

app.rabbitmq.exchange.notification=notification.exchange
app.rabbitmq.exchange.attendance=attendance.exchange
app.rabbitmq.queue.notification=notification.queue
app.rabbitmq.queue.attendance=attendance.queue
app.rabbitmq.routing.notification=notification.routing.key
app.rabbitmq.routing.attendance=attendance.routing.key

# ===================== JWT =====================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}
app.jwt.qr-expiration=${JWT_QR_EXPIRATION}

# ===================== MAIL =====================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================== PASSWORD RESET =====================
app.password-reset.token-ttl-seconds=900
app.password-reset.reset-url=${FRONTEND_URL}/reset-password