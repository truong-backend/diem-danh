# docker-compose.yml — nhánh back-end của diem-danh
version: '3.8'
name: diem-danh

services:
  neo4j:
    image: neo4j:5
    container_name: diem-danh-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_dd_data:/data
    networks:
      - diem-danh-net
    restart: unless-stopped

  redis-dd:
    image: redis:7.2-alpine
    container_name: diem-danh-redis
    command: redis-server --requirepass admin
    networks:
      - diem-danh-net
    restart: unless-stopped

  rabbitmq-dd:
    image: rabbitmq:3.13-management-alpine
    container_name: diem-danh-rabbitmq
    networks:
      - diem-danh-net
    restart: unless-stopped

  minio-dd:
    image: minio/minio:latest
    container_name: diem-danh-minio
    command: server /data --console-address ":9004"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_dd_data:/data
    ports:
      - "9003:9000"
      - "9004:9004"
    networks:
      - diem-danh-net
    restart: unless-stopped

  backend:
    image: ghcr.io/truong-backend/diem-danh-backend:latest
    container_name: diem-danh-backend
    env_file:
      - /opt/diem-danh/.env
    ports:
      - "8080:8080"
    depends_on:
      - neo4j
      - redis-dd
      - rabbitmq-dd
      - minio-dd
    networks:
      - diem-danh-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/truong-backend/diem-danh-frontend:latest
    container_name: diem-danh-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend
    networks:
      - diem-danh-net
    restart: unless-stopped

networks:
  diem-danh-net:
    driver: bridge

volumes:
  neo4j_dd_data:
  minio_dd_data: